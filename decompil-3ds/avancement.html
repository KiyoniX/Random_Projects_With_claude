<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avancement Décompil 3DS</title>
<meta name="description" content="L'avancement du chantier, lu dans etat.js ; la page se recharge seule chaque minute.">
<style>
:root { color-scheme: light dark; }
body { font-family: sans-serif; max-width: 1000px; margin: auto; padding: 16px; }
svg { display: block; width: 100%; height: auto; }
table { border-collapse: collapse; margin-bottom: 8px; }
th, td { border: 1px solid #ccc; padding: 2px 8px; }
td + td, th + th { text-align: right; font-variant-numeric: tabular-nums; }
@media (prefers-color-scheme: dark) { th, td { border-color: #444; } }
.groupe td { font-weight: bold; }
</style>
</head>
<body>
<h1>Avancement</h1>
<div id="carte"></div>
<p id="maj">etat.js manque : lancer <code>python outils/couverture.py mesure</code> dans decompil-3ds, puis recharger la page.</p>
<div id="corps"></div>
<script src="etat.js"></script>
<script>
(function () {
  // Mêmes groupes que outils/tableau.py.
  var BOOT = ['boot9', 'boot11', 'arm9loader', 'kernel9', 'process9'];
  var KERNEL = ['kernel11'];
  var APPLETS = ['appleted', 'cabinet', 'cherry', 'ctrapp', 'error', 'error-safe', 'extrapad', 'friend', 'hmvp', 'memolib',
    'menu', 'mint', 'newslist', 'olv', 'pnote_ap', 'snote_ap', 'skater', 'solv3', 'swkbd', 'swkbd-safe'];
  var ORDER = ['Démarrage et ARM9', 'Noyau ARM11', 'Modules système', 'Applets', 'Jeu (Pokémon X)'];
  var PER_SQUARE = 16;     // fonctions par carré de la carte : 254 501 carrés d'un pixel ne se verraient pas
  var W = 1000, H = 560, DONE = '#2ea043', TODO = '#6e7681', BACK = '#0d1117';

  function groupOf(name) {
    if (BOOT.indexOf(name) >= 0) return ORDER[0];
    if (KERNEL.indexOf(name) >= 0) return ORDER[1];
    if (APPLETS.indexOf(name) >= 0) return ORDER[3];
    if (name === 'maj' || name.indexOf('.cro') === 0) return ORDER[4];
    return ORDER[2];
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function fr(n) { return n.toLocaleString('fr-FR'); }
  function pct(a, b) { return b ? Math.floor(100 * a / b) + ' %' : '-'; }
  function pct2(a, b) { return (100 * a / b).toFixed(2).replace('.', ',') + ' %'; }

  // Treemap « squarified » (Bruls, Huizing, van Wijk) : des blocs aussi carrés que possible, d'aire proportionnelle.
  function squarify(items, x, y, w, h) {
    var total = items.reduce(function (s, it) { return s + it.value; }, 0), out = [], rest = items.slice();
    var scale = w * h / total;
    while (rest.length) {
      var side = Math.min(w, h), row = [], best = Infinity;
      while (rest.length) {
        var trial = row.concat([rest[0]]), sum = 0, max = 0, min = Infinity;
        trial.forEach(function (it) { var a = it.value * scale; sum += a; max = Math.max(max, a); min = Math.min(min, a); });
        var worst = Math.max(side * side * max / (sum * sum), sum * sum / (side * side * min));
        if (worst > best) break;
        best = worst; row = trial; rest.shift();
      }
      var area = row.reduce(function (s, it) { return s + it.value * scale; }, 0), thick = area / side, pos = 0;
      row.forEach(function (it) {
        var len = it.value * scale / thick;
        out.push(w >= h ? { it: it, x: x, y: y + pos, w: thick, h: len } : { it: it, x: x + pos, y: y, w: len, h: thick });
        pos += len;
      });
      if (w >= h) { x += thick; w -= thick; } else { y += thick; h -= thick; }
    }
    return out;
  }

  // Les carrés d'un bloc : la plus grande taille qui les fait tous tenir, les nommés d'abord.
  function squares(r, n, done) {
    var s = Math.sqrt(r.w * r.h / n), cols, rows;
    for (;;) { cols = Math.max(1, Math.floor(r.w / s)); rows = Math.ceil(n / cols); if (rows * s <= r.h || s < 0.5) break; s *= 0.97; }
    var out = [];
    for (var i = 0; i < n; i++) {
      out.push('<rect x="' + (r.x + (i % cols) * s).toFixed(2) + '" y="' + (r.y + Math.floor(i / cols) * s).toFixed(2) +
        '" width="' + s.toFixed(2) + '" height="' + s.toFixed(2) + '" fill="' + (i < done ? DONE : TODO) + '"/>');
    }
    return out.join('');
  }

  function label(x, y, text, size) {
    return '<text x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" font-family="sans-serif" font-size="' + size +
      '" fill="#fff" stroke="' + BACK + '" stroke-width="3" paint-order="stroke">' + esc(text) + '</text>';
  }

  function carte(f, groups) {
    var top = 30, svg = ['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + ' ' + H + '">',
      '<rect width="' + W + '" height="' + H + '" fill="' + BACK + '"/>',
      label(4, 21, 'Console et jeu : ' + pct2(f.nommees, f.total) + ' (' + fr(f.nommees) + ' / ' + fr(f.total) + ' fonctions nommées et relues)', 16)];
    var blocks = ORDER.filter(function (k) { return groups[k]; }).map(function (k) { return { name: k, value: groups[k].total }; });
    squarify(blocks, 1, top, W - 2, H - top - 1).forEach(function (g) {
      var inner = groups[g.it.name].list.filter(function (b) { return b.trouvees; })
        .sort(function (a, b) { return b.trouvees - a.trouvees; })
        .map(function (b) { return { b: b, value: Math.ceil(b.trouvees / PER_SQUARE) }; });
      squarify(inner, g.x + 2, g.y + 2, g.w - 4, g.h - 4).forEach(function (r) {
        var b = r.it.b, pad = { x: r.x + 0.5, y: r.y + 0.5, w: r.w - 1, h: r.h - 1 };
        svg.push('<g><title>' + esc(b.nom) + ' : ' + fr(b.nommees) + ' / ' + fr(b.trouvees) + ' (' + pct(b.nommees, b.trouvees) + ')</title>' +
          squares(pad, r.it.value, Math.round(b.nommees / PER_SQUARE)) + '</g>');
        if (r.w > b.nom.length * 6.8 + 8 && r.h > 18) svg.push(label(r.x + 4, r.y + 14, b.nom, 12));
      });
    });
    svg.push('</svg>');
    return svg.join('');
  }

  var etat = window.ETAT;
  if (!etat) return;
  var f = etat.fonctions, groups = {};
  f.binaires.forEach(function (b) {
    var k = groupOf(b.nom), g = groups[k] = groups[k] || { total: 0, named: 0, proposed: 0, list: [] };
    g.total += b.trouvees; g.named += b.nommees; g.proposed += b.proposees_haute + b.proposees_moyenne; g.list.push(b);
  });

  document.getElementById('carte').innerHTML = carte(f, groups);
  document.getElementById('maj').innerHTML = 'Lu dans <code>etat.json</code> (écrit par <code>outils/couverture.py mesure</code>), mis à jour le ' +
    esc(etat.mise_a_jour_heure || etat.mise_a_jour) + '. Un carré vaut ' + PER_SQUARE + ' fonctions ; vert : nommée et relue (deux voies). ' +
    'La page se recharge chaque minute.';

  var html = '<h2>Décompilation</h2><table><tr><th>Groupe</th><th>Nommées</th><th>Proposées</th><th>Total</th><th>%</th></tr>';
  ORDER.filter(function (k) { return groups[k]; }).forEach(function (k) {
    var g = groups[k];
    html += '<tr><td>' + esc(k) + '</td><td>' + fr(g.named) + '</td><td>' + fr(g.proposed) + '</td><td>' + fr(g.total) + '</td><td>' + pct(g.named, g.total) + '</td></tr>';
  });
  html += '<tr><th>Total</th><th>' + fr(f.nommees) + '</th><th></th><th>' + fr(f.total) + '</th><th>' + pct2(f.nommees, f.total) + '</th></tr></table>' +
    '<p>« Proposées » : noms d\'une seule voie, dans <code>local/analyse/&lt;module&gt;/noms-proposes*.tsv</code>, en attente de relecture ; ils ne comptent pas.</p>';

  html += '<h2>Binaires</h2><table><tr><th>Binaire</th><th>Nommées</th><th>Proposées</th><th>Total</th><th>%</th></tr>';
  ORDER.filter(function (k) { return groups[k]; }).forEach(function (k) {
    html += '<tr class="groupe"><td colspan="5">' + esc(k) + '</td></tr>';
    groups[k].list.slice().sort(function (a, b) { return a.nom < b.nom ? -1 : 1; }).forEach(function (b) {
      html += '<tr><td>' + esc(b.nom) + '</td><td>' + fr(b.nommees) + '</td><td>' + fr(b.proposees_haute + b.proposees_moyenne) +
        '</td><td>' + fr(b.trouvees) + '</td><td>' + pct(b.nommees, b.trouvees) + '</td></tr>';
    });
  });
  html += '</table>';

  var weight = 0, overall = 0;
  etat.paliers.forEach(function (p) { weight += p.poids; });
  html += '<h2>Paliers du projet</h2><table><tr><th>Palier</th><th>Faites</th><th>Tâches</th><th>%</th></tr>';
  etat.paliers.forEach(function (p) {
    var done = p.taches.filter(function (t) { return t.fait; }).length;
    overall += (done / p.taches.length) * p.poids / weight;
    html += '<tr><td>' + p.id + '. ' + esc(p.nom) + '</td><td>' + done + '</td><td>' + p.taches.length + '</td><td>' + pct(done, p.taches.length) + '</td></tr>';
  });
  html += '<tr><th>Pondéré</th><th></th><th></th><th>' + Math.floor(100 * overall) + ' %</th></tr></table>';

  html += '<h2>Portage natif</h2><table><tr><th>Mesure</th><th>Fonctions</th><th>Total</th><th>%</th></tr>' +
    '<tr><td>Recompilées (ARM → C)</td><td>' + fr(f.recompilees) + '</td><td>' + fr(f.total) + '</td><td>' + pct(f.recompilees, f.total) + '</td></tr>' +
    '<tr><td>Citées dans les fiches</td><td>' + fr(f.citees) + '</td><td>' + fr(f.total) + '</td><td>' + pct(f.citees, f.total) + '</td></tr></table>';

  html += '<h2>Prochaine action</h2><p>' + esc(etat.prochaine_action) + '</p>';
  document.getElementById('corps').innerHTML = html;

  setTimeout(function () { location.reload(); }, 60000);
})();
</script>
</body>
</html>
