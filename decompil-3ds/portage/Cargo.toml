[workspace]
resolver = "3"
members = ["crates/capture", "crates/formats", "crates/pica", "crates/overlay", "crates/portage", "crates/romfs", "crates/cro", "crates/kernel", "crates/hostcpu", "crates/services", "crates/runtime"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# Versions fixées (pas de caret) : le portage doit se reconstruire à l'identique.
[workspace.dependencies]
wgpu = "=29.0.4"
winit = "=0.30.13"
bytemuck = { version = "=1.25.2", features = ["derive"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
pollster = "=0.4.0"
flate2 = "=1.1.10"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[profile.release]
opt-level = 3
debug = false

[profile.dev.package."*"]
opt-level = 2
