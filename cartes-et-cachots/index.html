<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartes &amp; Cachots</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="poste" id="poste" data-mode="donjon">
    <div class="scene" id="scene">
      <div class="lunette">
        <main class="tube" id="tube" aria-label="Écran du jeu">
          <div class="ecran" id="ecran"></div>
          <span class="etalon" id="etalon" aria-hidden="true">0000000000</span>
        </main>
      </div>
    </div>

    <div class="plaque">
      <h1>Cartes &amp; Cachots</h1>
      <p>Molette : zoom. Glisser : déplacer la vue. Double-clic : taille ajustée.</p>
    </div>

    <div class="clavier">
      <div class="croix">
        <button type="button" class="haut" data-act="move" data-i="0" aria-label="Haut">^</button>
        <button type="button" class="gauche" data-act="move" data-i="2" aria-label="Gauche">&lt;</button>
        <button type="button" data-act="wait" aria-label="Attendre">.</button>
        <button type="button" data-act="move" data-i="3" aria-label="Droite">&gt;</button>
        <button type="button" class="bas" data-act="move" data-i="1" aria-label="Bas">v</button>
      </div>
      <div class="fonctions">
        <button type="button" data-act="potion">Potion</button>
        <button type="button" data-act="deck">Deck</button>
        <button type="button" class="verte" data-act="guide">Guide</button>
        <button type="button" data-act="zout" aria-label="Réduire l'affichage">−</button>
        <button type="button" data-act="zfit" aria-label="Taille ajustée">1:1</button>
        <button type="button" data-act="zin" aria-label="Agrandir l'affichage">+</button>
      </div>
    </div>
  </div>

  <p class="annonce" id="annonce" aria-live="polite"></p>
  <script src="game.js"></script>
</body>
</html>
