<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Projects</title>
  <link rel="stylesheet" href="portail/style.css">
</head>
<body>
  <header class="top">
    <div class="sign">
      <h1>Random Projects</h1>
      <p>La ludothèque : des jeux, des outils et des mondes générés, à sortir de l'étagère et à ouvrir ici même.</p>
    </div>
    <form class="ticket" id="seedForm">
      <label for="seed">Graine commune</label>
      <div class="ticket-row">
        <input id="seed" type="text" maxlength="24" autocomplete="off" spellcheck="false">
        <button type="button" id="random">Tirer au sort</button>
      </div>
      <p>Les boîtes marquées d'un point doré la reprennent : même graine, même planète, même ville, même donjon.</p>
    </form>
  </header>

  <div class="room">
    <main id="shelves"></main>
    <aside class="table" id="table" aria-live="polite"></aside>
  </div>

  <script src="portail/app.js"></script>
</body>
</html>
